name: kainyu-watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kainyu-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_LEVEL: ${{ vars.MIN_LEVEL || '2' }}
        run: python kainyu_watch.py
      - name: save state
        run: |
          git config user.name "kainyu-watch"
          git config user.email "actions@users.noreply.github.com"
          git add kainyu_seen.json
          git diff --cached --quiet && exit 0
          git commit -m "update kainyu state"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
